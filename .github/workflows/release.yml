name: Release

# Release assets are attached when the release is created, never afterwards:
# the repository has immutable releases enabled, and an upload to an existing
# release fails with `HTTP 422: Cannot upload assets to an immutable release`.
# That is why the two matrix builds only upload workflow artifacts and a single
# job creates the release with both disk images in one call.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: install frontend dependencies
        run: npm ci

      - name: build the app
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app

      # The disk image is assembled by dmg/build.sh: it lays the Finder window
      # out itself and fails the run when the stored positions are not the ones
      # the background was drawn for.
      - name: build the disk image
        id: dmg
        run: |
          set -eu
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          name=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          dmg="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/${name}_${version}_${{ matrix.arch }}.dmg"
          src-tauri/dmg/build.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/${name}.app" \
            "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.arch }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dmg

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -eu
          tag="${{ github.ref_name }}"
          # The product name is read from the tag, not from a literal: the app was
          # renamed once and the release title plus asset names follow tauri.conf.json.
          name=$(gh api "repos/${GH_REPO}/contents/src-tauri/tauri.conf.json?ref=${tag}" \
            -H "Accept: application/vnd.github.raw" | jq -r .productName)
          ls -l dmg
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists, and an immutable release cannot accept assets afterwards — delete the release and push the tag again"
            exit 1
          fi
          # Checksums ship with the release: an immutable release can never gain them
          # later, and the Homebrew cask needs one per architecture to pin a sha256.
          # GitHub rewrites spaces in asset names to dots, so the checksum lines name
          # the asset as it will be downloadable, not as it sits on disk. sha256sum is
          # the Ubuntu spelling; shasum is the macOS one.
          (cd dmg && for f in *.dmg; do
            sum=$(if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f"; else shasum -a 256 "$f"; fi | cut -d' ' -f1)
            printf '%s  %s\n' "$sum" "$(printf '%s' "$f" | tr ' ' '.')"
          done > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$tag" \
            --verify-tag \
            --title "$name $tag" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." \
            dmg/*.dmg dmg/SHA256SUMS.txt

      - name: keep the Homebrew cask current
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "no TAP_TOKEN secret: the cask bump workflow in dm0xa/homebrew-tap picks this up on its schedule"
            exit 0
          fi
          gh workflow run bump.yml -R dm0xa/homebrew-tap
